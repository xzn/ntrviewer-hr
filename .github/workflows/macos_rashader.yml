on:
  workflow_dispatch:

jobs:
  build-macos-rashader:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ntrviewer-hr
      - uses: actions/checkout@v5
        with:
          repository: SnowflakePowered/librashader
          path: librashader
          ref: librashader-v0.10.0
      - name: Compile librashader
        run: |
          ntrviewer-hr/macos-scripts/compile-rashader.sh
          mkdir -p macos-rashader/include
          ln -s ../../librashader/include/librashader.h macos-rashader/include/librashader.h
          mkdir macos-rashader/lib
          ln -s ../../librashader/target/optimized/liblibrashader_capi.dylib macos-rashader/lib/librashader.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: macos-rashader
          path: macos-rashader
