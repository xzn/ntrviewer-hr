on:
  workflow_dispatch:

env:
  VULKAN_VERSION: 1.4.357.1

jobs:
  build-macos-app-intel:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5
        with:
          path: ntrviewer-hr
      - name: Get artifact
        id: artifact-name
        run: |
          RUN=$(gh run list --repo ${{ github.repository }} -L 1 -w macos_rashader_intel.yml --json databaseId -q '.[0].databaseId')
          gh run download --repo ${{ github.repository }} $RUN -n macos-rashader-intel -D macos-rashader-intel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile NTRViewer-HR
        run: |
          source ntrviewer-hr/macos-scripts/install-reqs.sh
          ln -s ../../macos-rashader-intel/include/librashader.h ntrviewer-hr/include/librashader.h
          mkdir ntrviewer-hr/lib
          ln -s ../../macos-rashader-intel/lib/librashader.dylib ntrviewer-hr/lib/librashader.dylib
          pushd ntrviewer-hr
          source ~/VulkanSDK/$VULKAN_VERSION/setup-env.sh
          export PKG_CONFIG_PATH="/opt/local/lib/pkgconfig:/opt/local/share/pkgconfig:$PKG_CONFIG_PATH"
          export CPATH="/opt/local/include:$VULKAN_SDK/include:$CPATH"
          export LIBRARY_PATH="/opt/local/lib:$VULKAN_SDK/lib:$LIBRARY_PATH"
          make -j$(sysctl -n hw.logicalcpu)
          popd
      - name: Package NTRViewer-HR
        run: |
          mkdir macos-app-intel
          pushd macos-app-intel
          ../ntrviewer-hr/macos-scripts/complete-deps.sh
          popd
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-intel
          path: macos-app-intel
