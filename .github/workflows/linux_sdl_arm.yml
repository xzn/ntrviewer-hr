on:
  workflow_dispatch:

jobs:
  build-linux-sdl-arm:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Install prereq
        run: |
          sudo apt update
          sudo apt install -y --fix-missing git curl cmake clang ninja-build meson python3 wget build-essential checkinstall zlib1g-dev libssl-dev pkg-config gh libvulkan-dev libopengl-dev libsdl2-dev libpipewire-0.3-dev
      - uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL
          path: SDL
          ref: release-3.4.0
      - name: Compile sdl
        run: |
          cd SDL
          cmake -B build -DCMAKE_INSTALL_PREFIX=$(realpath ../linux-sdl-arm) -DBUILD_SHARED_LIBS=Off
          cmake --build build
          cmake --install build
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: linux-sdl-arm
          path: linux-sdl-arm
