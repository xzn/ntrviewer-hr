on:
  workflow_dispatch:

env:
  VULKAN_VERSION: 1.4.321.0

jobs:
  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v5
        with:
          path: ntrviewer-hr
      - uses: actions/download-artifact@v5
        with:
          name: rashader-intel
          path: rashader-intel
          github-token: ${{ secrets.GH_PAT }}
          run-id: rashader_intel.yml
      - name: Compile NTRViewer-HR
        run: |
          ntrviewer-hr/macos-scripts/install-reqs.sh
          ln -s ../../rashader-intel/include/librashader.h ntrviewer-hr/include/librashader.h
          mkdir ntrviewer-hr/lib
          ln -s ../../rashader-intel/target/optimized/liblibrashader_capi.dylib ntrviewer-hr/lib/librashader.dylib
          pushd ntrviewer-hr
          make -j$(sysctl -n hw.logicalcpu)
          popd
      - name: Package NTRViewer-HR
        run: |
          mkdir macos-intel
          pushd macos-intel
          ../ntrviewer-hr/macos-scripts/complete-deps.sh
          popd
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: macos-intel
