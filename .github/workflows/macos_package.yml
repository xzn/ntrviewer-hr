on:
  workflow_dispatch:

jobs:
  build-macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ntrviewer-hr
      - uses: actions/checkout@v5
        with:
          repository: bloc97/Anime4K
          path: Anime4K
      - uses: actions/checkout@v5
        with:
          repository: libretro/slang-shaders
          path: slang-shaders
      - uses: actions/download-artifact@v5
        with:
          name: macos
          path: macos
          github-token: ${{ secrets.GH_PAT }}
          run-id: macos.yml
      - uses: actions/download-artifact@v5
        with:
          name: macos-intel
          path: macos-intel
          github-token: ${{ secrets.GH_PAT }}
          run-id: macos-intel.yml
      - name: Package NTRViewer-HR
        run: |
          mkdir NTRViewer-HR-macOS-Universal
          pushd NTRViewer-HR-macOS-Universal
          cp ../ntrviewer-hr/macos-scripts/ntrviewer .
          chmod 755 ntrviewer
          mkdir -p NTRViewer-HR/Contents/MacOS
          cp ../ntrviewer-hr/macos-scripts/Info.plist NTRViewer-HR/Contents
          lipo -create ../pkg/ntrviewer ../pkg-intel/ntrviewer -output NTRViewer-HR/Contents/MacOS/ntrviewer
          cp ../ntrviewer-hr/rashader.json NTRViewer-HR/Contents/MacOS
          cp ../ntrviewer-hr/placebo.json NTRViewer-HR/Contents/MacOS
          cp -R ../pkg/arm64 NTRViewer-HR/Contents/MacOS/
          cp -R ../pkg-intel/x86_64 NTRViewer-HR/Contents/MacOS/
          mkdir -p NTRViewer-HR/Contents/MacOS/placebo-shaders/Anime4K
          cp -R ../Anime4K/glsl/* NTRViewer-HR/Contents/MacOS/placebo-shaders/Anime4K/
          mkdir -p NTRViewer-HR/Contents/MacOS/slang-shaders
          cp -R ../slang-shaders/{anti-aliasing,edge-smoothing,interpolation,pixel-art-scaling,stock.slang} NTRViewer-HR/Contents/MacOS/slang-shaders/
          popd
          ntrviewer-hr/macos-scripts/compress.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NTRViewer-HR-macOS-Universal.zip
          path: NTRViewer-HR-macOS-Universal.zip
          compression-level: 0
