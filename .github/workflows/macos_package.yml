on:
  workflow_dispatch:

jobs:
  build-macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ntrviewer-hr
      - uses: actions/checkout@v5
        with:
          repository: bloc97/Anime4K
          path: Anime4K
      - uses: actions/checkout@v5
        with:
          repository: libretro/slang-shaders
          path: slang-shaders
      - name: Get artifact
        id: artifact-name
        run: |
          RUN=$(gh run list --repo ${{ github.repository }} -L 1 -w macos_app.yml --json databaseId -q '.[0].databaseId')
          gh run download --repo ${{ github.repository }} $RUN -n macos-app -D macos-app
          RUN=$(gh run list --repo ${{ github.repository }} -L 1 -w macos_app_intel.yml --json databaseId -q '.[0].databaseId')
          gh run download --repo ${{ github.repository }} $RUN -n macos-app-intel -D macos-app-intel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package NTRViewer-HR
        run: |
          cargo install --git https://github.com/indygreg/apple-platform-rs --branch main --bin rcodesign apple-codesign
          ntrviewer-hr/macos-scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NTRViewer-HR-macOS-Universal.zip
          path: NTRViewer-HR-macOS-Universal.zip
          compression-level: 0
